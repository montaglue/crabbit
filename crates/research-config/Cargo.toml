[package]
name = "research-config"
description = "crabbit research-engine configuration (CRABBIT_REGALLOC/_ORACLE/_BLOCK_FREQ parsing and allocator construction), shared by the rustc backend and the resident driver so flag semantics cannot drift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
pliron.workspace = true
pliron-ll.workspace = true
serde_json.workspace = true

[features]
# Engine availability is a link-time property (see the crate docs and
# crates/crabbit-research): the private research repositories cannot be
# referenced from this public workspace, even optionally — cargo resolves
# optional dependencies into the lockfile regardless of features. These
# feature names remain declared, default-off and empty, only so existing
# `--features eregalloc,cmt` invocations keep building.
default = []
eregalloc = []
cmt = []
