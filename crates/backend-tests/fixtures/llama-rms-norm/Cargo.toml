[package]
name = "crabbit-llama-rms-norm"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81", default-features = false }
cuda-macros = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81", default-features = false }

[[bin]]
name = "crabbit-llama-rms-norm"
path = "src/main.rs"

# Keep this fixture out of the parent workspace. It is compiled explicitly by
# crabbit-rust backend tests once the GPU frontend supports the required MIR.
[workspace]
