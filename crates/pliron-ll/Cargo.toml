[package]
name = "pliron-ll"
description = "Native machine backends (aarch64 darwin/linux, x86_64 darwin) for pliron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["aarch64", "x86-64", "codegen", "pliron", "compiler"]
categories = ["compilers"]

[dependencies]
pliron.workspace = true
pliron-llvm.workspace = true
awint.workspace = true
combine.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
log.workspace = true
# Profile-feedback sidecars (docs/PROFILE-FEEDBACK-PLAN.md): the blockmap
# writer and the CRABBIT_PROFILE reader exchange plain JSON.
serde_json.workspace = true

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true
# The differential dominator/post-dominator tests against combinatorial-
# matrix-theory's boolean-dataflow oracle live in the workspace-excluded
# crates/crabbit-research (private research checkouts; even dev path deps
# on them would break a fresh public checkout at resolution time).
