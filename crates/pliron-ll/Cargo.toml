[package]
name = "pliron-ll"
description = "Native machine backends (aarch64 darwin/linux, x86_64 darwin) for pliron"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["aarch64", "x86-64", "codegen", "pliron", "compiler"]
categories = ["compilers"]

[dependencies]
pliron.workspace = true
pliron-llvm.workspace = true
awint.workspace = true
combine.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
log.workspace = true

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true
# Differential oracle for the dominator analysis (dev-only: a path dep in
# [dependencies] would break `cargo publish`; dev-deps are stripped).
cmt-boolean-dataflow = { path = "../../../combinatorial-matrix-theory/compilers/crates/boolean-dataflow", package = "boolean-dataflow" }
cmt-support = { path = "../../../combinatorial-matrix-theory/compilers/crates/cmt-support", package = "cmt-support" }
