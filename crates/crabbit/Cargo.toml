[package]
name = "crabbit-core"
description = "The crabbit rustc-backend implementation as an rlib; the thin `crabbit` package wraps it into the loadable dylib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["rustc", "codegen-backend", "compiler", "pliron", "llvm"]
categories = ["compilers"]

[lib]
# rlib ONLY: every loadable backend is a thin dylib wrapper that links this
# statically (crates/crabbit-backend for the public libcrabbit.so, the
# workspace-excluded crates/crabbit-research for the research build).
# Exactly one Rust dylib per rustc process — a second one reintroduces the
# shared-generics/undefined-symbol hazards this layout exists to prevent.
name = "crabbit_core"
crate-type = ["rlib"]

[package.metadata.rust-analyzer]
rustc_private = true

# Uses `#![feature(rustc_private)]` against the `rustc-dev` component, which
# docs.rs does not provide, so a docs.rs build can never succeed here.
[package.metadata.docs.rs]
targets = []

[dependencies]
pliron.workspace = true
crabbit-mir.workspace = true
pliron-llvm.workspace = true
pliron-ll.workspace = true
research-config.workspace = true
llvm-export.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
combine.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
log.workspace = true
awint.workspace = true

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true

[features]
# Compat no-ops: engines are linked, not feature-gated (see
# crates/research-config's docs).
eregalloc = ["research-config/eregalloc"]
cmt = ["research-config/cmt"]
