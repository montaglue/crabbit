[package]
name = "crabbit-inspect-driver"
# Depends on the unpublished pliron-inspect-driver; local tooling only.
publish = false
description = "pliron-inspect driver for the crabbit dialects and passes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["pliron", "compiler", "cli", "debugging", "inspect"]
categories = ["compilers", "command-line-utilities"]

[lib]
name = "crabbit_inspect_driver"
path = "src/lib.rs"

[[bin]]
name = "crabbit-inspect-driver"
path = "src/main.rs"

[[bin]]
name = "crabbit-analysisd"
path = "src/bin/analysisd.rs"

[dependencies]
pliron.workspace = true
pliron-llvm.workspace = true
pliron-ll.workspace = true
crabbit-mir.workspace = true
pliron-inspect-driver.workspace = true
research-config.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
pliron-inspect-protocol.workspace = true

[features]
default = ["eregalloc", "cmt"]
eregalloc = ["research-config/eregalloc"]
cmt = ["research-config/cmt"]
