[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/montaglue/crabbit"

[workspace.dependencies]
# `version` is required alongside `path` so that `cargo publish` can resolve
# this dependency against crates.io once the local path is stripped from the
# packaged manifest. Locally, cargo still prefers the path.
# Upstream pliron from crates.io (0.20.0), unpatched. cuda-oxide's crates
# below pin the same release ("=0.20.0"); every consumer — extensions
# included — must resolve one pliron or types do not unify.
pliron = "0.20.0"
# The LLVM dialect itself comes from pliron; `default-features = false`
# drops the `llvm-sys` binding so no LLVM libraries are linked.
pliron-llvm = { version = "0.20.0", default-features = false }
# Our own sibling repo (github.com/montaglue/pliron-inspect), pinned by
# rev; bump the pin after pushing changes there.
pliron-inspect-driver = { git = "https://github.com/montaglue/pliron-inspect.git", rev = "f560c782ccdc5eb38f7de0d51bbd340657798a22" }
pliron-inspect-protocol = { git = "https://github.com/montaglue/pliron-inspect.git", rev = "f560c782ccdc5eb38f7de0d51bbd340657798a22" }
# cuda-oxide's MIR-on-pliron stack, consumed unpatched from NVIDIA's
# upstream repository at one pinned revision (the "CUDA Rust" monorepo
# nests these crates under cuda-oxide/crates/; cargo resolves them by
# package name, and their transitive crates come along). No fork and no
# vendored copy: what the lowering lacks for crabbit is done by crabbit
# passes around it (function linkage: crates/mir/src/passes/linkage.rs)
# or proposed upstream.
#   dialect-mir  the `mir` dialect: types, ops and their verifier -- the
#                typing contract crabbit's importer must meet
#   mir-lower    `mir` -> LLVM dialect lowering; verifies its input first
#   llvm-export  LLVM dialect -> textual LLVM IR, for the kernel comparison
#                arm (the "rust-llvm" PTX path)
# Their pliron pin ("=0.20.0") must equal ours or types do not unify.
dialect-mir = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
mir-lower = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
llvm-export = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
#   dialect-nvvm the `nvvm` dialect: the device intrinsics as ops, which the
#                importer builds for cuda-device's API and mir-lower lowers
#   reserved-oxide-symbols  the `#[kernel]` symbol conventions
dialect-nvvm = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
reserved-oxide-symbols = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "9df9e7cef561e03a066230b3bb433b3d8285da81" }
#   oxide-artifacts  the embedded device-artifact format cuda-oxide's host
#                API loads kernels from (`#[cuda_module]` `load()`); from
#                crates.io like upstream's own workspace, which keeps that
#                release equal to its in-tree copy -- the host side reads
#                the bundles crabbit writes with this same crate
oxide-artifacts = { version = "0.2.1", features = ["object-write"] }
# `version` on these intra-workspace deps is likewise required for `cargo
# publish`; keep them in lockstep with `workspace.package.version` above.
pliron-ll = { path = "crates/pliron-ll", version = "0.1.0" }
crabbit-core = { path = "crates/crabbit", version = "0.1.0" }
crabbit-config = { path = "crates/config", version = "0.1.0" }
crabbit-mir = { path = "crates/mir", version = "0.1.0" }
awint = "0"
combine = "4"
thiserror = "2"
rustc-hash = "2"
# Symbol demangling for the mir-level census (callee families).
rustc-demangle = "0.1"
log = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
expect-test = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"

# pliron-inspect opens this workspace as a project (from its UI): the render
# driver and the resident analysis server are built here, and traces,
# emitted modules and profiles are read from .crabbit-traces/.
[workspace.metadata.pliron-inspect]
driver = "crabbit-inspect-driver"
analysisd = "crabbit-analysisd"
traces = [".crabbit-traces"]
