[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor", "crates/crabbit-research"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/montaglue/crabbit"

[workspace.dependencies]
# `version` is required alongside `path` so that `cargo publish` can resolve
# this dependency against crates.io once the local path is stripped from the
# packaged manifest. Locally, cargo still prefers the path.
# Upstream pliron from crates.io (0.17.0), unpatched: fork independence,
# and it matches the version combinatorial-matrix-theory uses. The sibling
# cuda-oxide clone must agree on this exact crates.io version (both
# workspaces must resolve one pliron or types do not unify).
pliron = "0.17.0"
# The LLVM dialect itself comes from pliron; `default-features = false`
# drops the `llvm-sys` binding so no LLVM libraries are linked.
pliron-llvm = { version = "0.17.0", default-features = false }
# Our own sibling repo (github.com/montaglue/pliron-inspect), pinned by
# rev; bump the pin after pushing changes there.
pliron-inspect-driver = { git = "https://github.com/montaglue/pliron-inspect.git", rev = "dd5cbbe8511c9d02cae4e74dba56fd77d170793d" }
pliron-inspect-protocol = { git = "https://github.com/montaglue/pliron-inspect.git", rev = "dd5cbbe8511c9d02cae4e74dba56fd77d170793d" }
# cuda-oxide's MIR-on-pliron port, consumed from the sibling clone's
# `crabbit-patches` branch: NVlabs upstream rev b099f64c plus a minimal,
# upstreamable patch series (see that branch's log; discipline: every patch
# is either submitted upstream or carries a written why-not). The clone's
# pliron pin must stay identical to ours or types do not unify. Their
# dialect also registers as `mir`, so a Context can hold either this
# dialect or crabbit's own `cmir`, never both.
# The crabbit-patches branch of our fork of NVlabs/cuda-oxide: upstream
# rev b099f64c plus two patches (function-linkage propagation through the
# lowering; port to crates.io pliron 0.17). Both written to be
# upstreamable; drop the fork when they land there.
dialect-mir = { git = "https://github.com/montaglue/cuda-oxide.git", rev = "c8ad357fffa26cd5801f110cea286d4a5c92a032" }
mir-lower = { git = "https://github.com/montaglue/cuda-oxide.git", rev = "c8ad357fffa26cd5801f110cea286d4a5c92a032" }
# cuda-oxide's textual LLVM IR exporter: the bridge from crabbit's kernel
# module to the LLVM NVPTX toolchain (the "rust-llvm" comparison arm).
llvm-export = { git = "https://github.com/montaglue/cuda-oxide.git", rev = "c8ad357fffa26cd5801f110cea286d4a5c92a032" }
# `version` on these intra-workspace deps is likewise required for `cargo
# publish`; keep them in lockstep with `workspace.package.version` above.
pliron-ll = { path = "crates/pliron-ll", version = "0.1.0" }
# The research engines (eregalloc, combinatorial-matrix-theory) are NOT
# dependencies of this workspace: they live in private repositories, and
# cargo resolves even optional dependencies into the lockfile, so any
# reference here would break a fresh public checkout. They are composed
# into a research build by the workspace-excluded crates/crabbit-research
# dylib (path deps on the sibling checkouts; engines registered at load).
crabbit-core = { path = "crates/crabbit", version = "0.1.0" }
research-config = { path = "crates/research-config", version = "0.1.0", default-features = false }
crabbit-mir = { path = "crates/mir", version = "0.1.0" }
awint = "0"
combine = "4"
thiserror = "2"
rustc-hash = "2"
log = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
expect-test = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
