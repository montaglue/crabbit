name: coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  llvm-cov:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System deps (triskel C++ bindings need fmt>=10 + modern g++)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-14 libffi-dev cmake
          # apt's libfmt is v9; triskel relies on fmt>=10 (format_as).
          # Build fmt 11 into /usr/local, matching the dev machines.
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/11.0.2.tar.gz | tar xz -C /tmp
          cmake -S /tmp/fmt-11.0.2 -B /tmp/fmt-build -DFMT_TEST=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON >/dev/null
          cmake --build /tmp/fmt-build -j >/dev/null
          sudo cmake --install /tmp/fmt-build >/dev/null
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Toolchain
        run: rustup show && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (library crates)
        run: cargo llvm-cov -p pliron-ll -p research-config -p crabbit-mir --lcov --output-path lcov.info --locked
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
